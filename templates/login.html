<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ - เงินเดินได้</title>
<meta name="description" content="ให้บริการ เว็บ รายรับ-รายจ่าย ที่ครบวงจร ข้อมูลทั้งหมดจะถูกจัดเก็บในรูปแบบไฟล์ .csv ใน Google Drive ของ User">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --side: #0f3d33;
    --accent: #f2b544;
    --bg: #f3f6f4;
    --card: #ffffff;
    --text: #17231f;
    --muted: #6b7a74;
    --line: #dde5e1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
    background: var(--side);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    background: var(--card);
    border-radius: 18px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .brand {
    font-size: 1.8rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .brand-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); }
  .tagline { color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
  .google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    font: inherit;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
  }
  .google-btn:hover { background: var(--bg); }
  .google-btn:focus-visible { outline: 2px solid var(--side); outline-offset: 2px; }
  .google-btn svg { width: 20px; height: 20px; }
  .note { margin-top: 24px; font-size: .85rem; color: var(--muted); line-height: 1.6; }
  .error { margin-bottom: 16px; color: #b3261e; font-size: .9rem; }
</style>
</head>
<body>
  <main class="box">
    <div class="brand"><span class="brand-dot"></span>เงินเดินได้</div>
    <p class="tagline">จดรายรับรายจ่าย ดูเงินเก็บของคุณได้ในที่เดียว</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <a class="google-btn" href="{{ url_for('auth_google') }}">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
        <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      เข้าสู่ระบบด้วย Google
    </a>

    <p class="note">ข้อมูลของคุณเก็บไว้ใน Google Drive ของคุณเอง เราจะไม่มีการบันทึกข้อมูลใดๆ</p>
  </main>
</body>
</html>
